<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>दैनिक हिसाब एवं रूम शीट — होटल विवांता</title>
<style>
	@page { size: A4 portrait; margin: 9mm; }

	* { box-sizing: border-box; }

	html, body {
		margin: 0;
		padding: 0;
		background: #f1f1f1;
	}

	body {
		font-family: 'Devanagari Sangam MN', 'Kohinoor Devanagari', 'Nirmala UI',
			'Noto Sans Devanagari', 'Mangal', sans-serif;
		color: #000;
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
	}

	.toolbar {
		text-align: center;
		padding: 10mm 0 0;
		font-family: system-ui, -apple-system, sans-serif;
	}

	.toolbar button {
		font: inherit;
		font-size: 15px;
		padding: 9px 22px;
		border-radius: 8px;
		border: 1px solid #4a2a17;
		background: #4a2a17;
		color: #fff;
		cursor: pointer;
	}

	.sheet {
		width: 190mm;
		margin: 8mm auto;
		background: #fff;
		padding: 0;
		display: flex;
		flex-direction: column;
	}

	/* ------------------------------------------------------------ header */

	.head {
		border: 1.4pt solid #000;
		border-bottom: 0;
		padding: 3mm 4mm 2.5mm;
		text-align: center;
	}

	.hotel {
		font-size: 22pt;
		font-weight: 700;
		line-height: 1.15;
		letter-spacing: 0.02em;
	}

	.sheet-title {
		font-size: 13.5pt;
		font-weight: 700;
		margin-top: 2mm;
		padding-top: 1.5mm;
		border-top: 0.6pt solid #000;
	}

	.meta {
		display: flex;
		justify-content: space-between;
		align-items: flex-end;
		gap: 6mm;
		border: 1.4pt solid #000;
		border-bottom: 0;
		padding: 2.2mm 4mm;
		font-size: 11pt;
		font-weight: 700;
	}

	.meta .fill {
		display: inline-block;
		min-width: 45mm;
		border-bottom: 0.8pt solid #000;
		margin-left: 2mm;
	}

	/* ------------------------------------------------------------- table */

	table {
		width: 100%;
		border-collapse: collapse;
		table-layout: fixed;
	}

	th, td {
		border: 0.8pt solid #000;
		padding: 0;
		text-align: center;
	}

	thead th {
		font-size: 11.5pt;
		font-weight: 700;
		height: 9mm;
		background: #e9e9e9;
		border-width: 1.4pt 0.8pt;
	}

	tbody td { height: 8.5mm; }

	.opening td {
		height: 8mm;
		background: #f4f4f4;
	}

	.opening .label {
		font-size: 11pt;
		font-weight: 700;
		text-align: right;
		padding-right: 3mm;
	}

	.extras td { height: 34mm; vertical-align: top; }

	.extras .label {
		font-size: 11pt;
		font-weight: 700;
		text-align: left;
		padding: 2mm 3mm;
		line-height: 1.9;
	}

	.total td {
		height: 10mm;
		font-size: 12pt;
		font-weight: 700;
		background: #e9e9e9;
		border-width: 1.4pt 0.8pt;
	}

	.total .label {
		text-align: right;
		padding-right: 3mm;
	}

	/* ------------------------------------------------------------ footer */

	.foot {
		border: 1.4pt solid #000;
		border-top: 0;
	}

	.shree-box {
		border-bottom: 0.8pt solid #000;
		padding: 2.8mm 4mm;
		font-size: 12pt;
		font-weight: 700;
		display: flex;
		align-items: center;
		gap: 3mm;
	}

	.shree-box .fill {
		flex: 1;
		border-bottom: 0.8pt solid #000;
		height: 6.5mm;
	}

	.comments {
		display: flex;
		align-items: flex-end;
		gap: 3mm;
		padding: 3mm 4mm 3.5mm;
	}

	.comments .label {
		font-size: 11pt;
		font-weight: 700;
		white-space: nowrap;
	}

	.comments .line {
		flex: 1;
		border-bottom: 0.6pt solid #000;
		height: 7mm;
	}

	.sign-row {
		display: flex;
		justify-content: space-between;
		gap: 10mm;
		padding: 0 4mm 3mm;
		font-size: 10pt;
		font-weight: 700;
	}

	.sign-row div {
		width: 55mm;
		border-top: 0.8pt solid #000;
		padding-top: 1mm;
		text-align: center;
	}

	@media print {
		html, body { background: #fff; }
		.sheet { width: auto; margin: 0; }
		.toolbar { display: none; }
	}
</style>
</head>
<body>

<div class="toolbar"><button onclick="window.print()">प्रिंट करें / PDF सेव करें</button></div>

<div class="sheet">

	<div class="head">
		<div class="hotel">होटल विवांता</div>
		<div class="sheet-title">दैनिक हिसाब एवं रूम शीट</div>
	</div>

	<div class="meta">
		<div>दिनांक : <span class="fill"></span></div>
		<div>वार : <span class="fill" style="min-width: 32mm;"></span></div>
	</div>

	<table>
		<thead>
			<tr>
				<th style="width: 16mm;">क्रमांक</th>
				<th style="width: 26mm;">कमरा नंबर</th>
				<th>UPI</th>
				<th>नकद</th>
				<th>आवक</th>
				<th>जावक</th>
			</tr>
		</thead>
		<tbody>
			<tr class="opening">
				<td colspan="4" class="label">ओपनिंग श्री (पिछला शेष)</td>
				<td></td>
				<td></td>
			</tr>
		</tbody>
	</table>

	<div class="foot">
		<div class="shree-box">श्री : <span class="fill"></span></div>
		<div class="comments">
			<div class="label">टिप्पणी :</div>
			<div class="line"></div>
		</div>
		<div class="sign-row">
			<div>मैनेजर के हस्ताक्षर</div>
			<div>मालिक के हस्ताक्षर</div>
		</div>
	</div>

</div>

<script>
	var BLANK_ROWS = 16;
	var NAMED_ROWS = ['पानी', 'कोल्ड ड्रिंक', 'एक्स्ट्रा'];

	var tbody = document.querySelector('tbody');
	var html = '';

	for (var i = 0; i < BLANK_ROWS; i++) {
		html += '<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
	}

	var labels = NAMED_ROWS.filter(function (name) { return name; })
		.map(function (name) { return '<div>' + name + '</div>'; })
		.join('');

	html += '<tr class="extras"><td colspan="2" class="label">' + labels + '</td>' +
		'<td colspan="4"></td></tr>';

	html += '<tr class="total"><td colspan="2" class="label">कुल योग</td><td></td><td></td><td></td><td></td></tr>';

	tbody.insertAdjacentHTML('beforeend', html);
</script>

</body>
</html>
